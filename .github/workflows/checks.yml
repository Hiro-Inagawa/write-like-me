name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install textstat spacy && python -m spacy download en_core_web_sm && python -m spacy download de_core_news_sm
      - run: python tests/run_tests.py
      - run: python tests/negative_control.py
      - run: python eval/voice_eval.py score --goldens eval/goldens/universal.goldens.jsonl --gate eval/baselines/universal.json
      - run: python eval/voice_eval.py score --goldens eval/goldens/universal-de.goldens.jsonl --language de --gate eval/baselines/universal-de.json
